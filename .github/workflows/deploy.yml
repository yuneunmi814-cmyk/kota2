name: deploy-web

# main에 push되면 Next.js를 정적으로 내보내 GitHub Pages에 올린다.
# basePath는 저장소 이름(/kota2). 도메인을 사면 NEXT_PUBLIC_BASE_PATH를 비우고
# NEXT_PUBLIC_SITE_URL을 새 도메인으로 바꾼다.

# ⛔ 2026-08-17 중단 — 사이트가 동적(Next.js + Supabase)으로 바뀌어 정적 내보내기가 없다.
# 배포는 Vercel이 맡는다(main에 push되면 자동). 이 파일은 수동 실행만 남겨 두되 실제로는 실패한다.
# GitHub Pages 주소로 들어오던 방문자는 Vercel 배포가 안정되면 리다이렉트로 넘긴다.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /kota2
          NEXT_PUBLIC_SITE_URL: https://yuneunmi814-cmyk.github.io/kota2
      # GitHub Pages는 _next/ 같은 밑줄 디렉터리를 Jekyll이 무시한다 — 끄지 않으면 CSS·JS가 404
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
